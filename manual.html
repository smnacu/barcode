<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual de Operaciones</title>
    <link rel="stylesheet" href="css/styles.css?v=3">
    <style>
        .manual-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 16px;
        }

        .faq-item {
            background: var(--bg-card);
            border: 1px solid rgba(128, 128, 128, 0.2);
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .faq-header {
            padding: 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            background: rgba(128, 128, 128, 0.05);
        }

        .faq-header:hover {
            background: rgba(128, 128, 128, 0.1);
        }

        .faq-content {
            padding: 0 16px;
            max-height: 0;
            overflow: hidden;
            transition: all 0.3s ease;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .faq-item.open .faq-content {
            padding: 16px;
            max-height: 1000px; /* Arbitrary large number */
            border-top: 1px solid rgba(128, 128, 128, 0.1);
        }

        .faq-icon {
            transition: transform 0.3s ease;
        }

        .faq-item.open .faq-icon {
            transform: rotate(180deg);
        }

        .search-hero {
            text-align: center;
            padding: 40px 20px;
            background: var(--bg-card);
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(128,128,128,0.2);
        }
        
        .search-hero input {
            width: 100%;
            max-width: 500px;
            padding: 16px;
            font-size: 18px;
            border-radius: 50px;
            border: 1px solid rgba(128,128,128,0.3);
            background: var(--bg-input);
            color: var(--text-main);
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .search-hero input:focus {
            border-color: var(--brand-red);
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="header-left">
            <span class="header-title">Manual de Instrucciones</span>
        </div>
        <div class="header-right">
            <a href="index.php" class="header-btn" title="Volver">↩ Volver</a>
        </div>
    </header>

    <div class="search-hero">
        <input type="text" id="search-input" placeholder="¿Qué estás buscando?">
    </div>

    <div class="manual-container" id="faq-list">
        <div style="text-align:center; padding: 40px;">Cargando...</div>
    </div>

    <script>
        // Copy theme logic from index
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
        }

        let allFaqs = [];

        fetch('api/admin.php?action=get_faq')
            .then(r => r.json())
            .then(data => {
                allFaqs = data;
                renderFaqs(allFaqs);
            })
            .catch(err => {
                document.getElementById('faq-list').innerHTML = '<div style="text-align:center; color: var(--error)">Error al cargar el manual</div>';
            });

        function renderFaqs(items) {
            const container = document.getElementById('faq-list');
            if (items.length === 0) {
                container.innerHTML = '<div style="text-align:center; opacity:0.6">No se encontraron resultados</div>';
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="faq-item" onclick="toggleItem(this)">
                    <div class="faq-header">
                        ${escapeHtml(item.title)}
                        <span class="faq-icon">▼</span>
                    </div>
                    <div class="faq-content">
                        ${formatContent(item.content)}
                    </div>
                </div>
            `).join('');
        }

        function toggleItem(el) {
            el.classList.toggle('open');
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function formatContent(text) {
            if (!text) return '';
            // Basic formatting: newlines to <br>
            return escapeHtml(text).replace(/\n/g, '<br>');
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allFaqs.filter(item => 
                item.title.toLowerCase().includes(term) || 
                item.content.toLowerCase().includes(term)
            );
            renderFaqs(filtered);
        });
    </script>
</body>
</html>
